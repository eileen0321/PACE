apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('hermes-compiler/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    enableBundleCompression = (findProperty('android.enableBundleCompression') ?: false).toBoolean()
    // Use Expo CLI to bundle the app, this ensures the Metro config
    // works correctly with Expo projects.
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"

    /* Folders */
     //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true in release builds to optimize the app using [R8](https://developer.android.com/topic/performance/app-optimization/enable-app-optimization).
 */
def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: false).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.strides7.pace'
    defaultConfig {
        applicationId 'com.strides7.pace'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // 2026-08-03 — bare workflow에서는 이 값이 진짜 versionCode다. app.json의
        // android.versionCode는 `expo prebuild`가 이 파일을 재생성할 때만 쓰이는데 우리는
        // prebuild를 안 돌리므로 무시된다(app.json만 4로 올렸다가 빌드가 또 code 3으로
        // 나온 것을 EAS 빌드 목록에서 확인). 올릴 때 두 곳을 같이 올릴 것.
        // 2026-08-10 — 비공개 테스트 갱신용으로 6 → 7 (app.json도 같이 올렸다, 위 주석의 규칙).
        // 2026-08-11 — 9 → 10. 담긴 것 중 실기기 검증 완료:
        //   · 보상형 광고가 1~2초 만에 사라지던 것(HOT 이어서재생이 광고 위로 유튜브를 열었음, b8d9793)
        //     검증: 22:53:52 광고 표시 → 22:54:01 reward earned, 그 구간 CHAIN fire 0건
        //   · 이어서재생이 감시 대상 앱 밖(런처)에서 발동하던 것
        //     검증: 23:07:14 홈 이동 후 CHAIN resync='null' ×4, fire/advance 0건
        //   함께 담기지만 미검증: Focus 타임아웃 플래그 prefs 영속화, 재설치 견디는 기기 id(SSAID),
        //   서버 허용량 연동(실패는 fail-open이라 앱을 깨뜨리지 않는다).
        // ⚠️ 광고는 **테스트 광고**다. 비공개 테스트 트랙(eas.json submit.android.track=alpha)에
        //   실광고를 실으면 테스터 클릭이 무효 트래픽으로 잡혀 AdMob 계정 정지 위험 —
        //   2026-08-10에 7→8→9로 되돌린 그 규칙 그대로다. 실광고는 프로덕션 트랙에서만.
        //   🔴 2026-08-13 정정 — 여기 적혀 있던 `EXPO_PUBLIC_USE_REAL_ADS 미설정`은 **틀린 근거**였다.
        //     그 이름을 읽는 코드는 없다(주석에만 존재). 실제 스위치는 adsConfig.ts의
        //     `EXPO_PUBLIC_ANDROID_REAL_ADS`이고, eas.json production에 명시적으로 "false"를 넣었다
        //     (없어도 기본이 테스트 광고지만, "빠뜨린 것"과 "정한 것"을 구분하기 위해 적어 둔다).
        //     프로덕션 트랙에 올리는 날 그 값을 "true"로 바꾼다.
        // ⛔ 2026-08-13 출시 직전에 잡은 함정 — **`.env`만 고치고 빌드하면 그 변경은 APK/AAB에 안 들어간다.**
        //   Gradle의 JS 번들 태스크(createBundleReleaseJsAndAssets)는 입력으로 JS 소스만 본다.
        //   `.env`는 번들 시점에 @expo/env가 읽어 값을 인라인하는데, 그 파일이 바뀌어도 태스크는
        //   UP-TO-DATE로 건너뛴다. 실제로 EXPO_PUBLIC_ANDROID_REAL_ADS=true로 바꾼 뒤 bundleRelease를
        //   돌렸는데 나온 AAB 안의 번들은 1시간 전(16:55) 것 그대로였고, 화면에도 "테스트 광고"가
        //   그대로 떴다 — 그대로 올렸으면 프로덕션 수익이 0이었다.
        //   → `.env`를 건드린 뒤에는 반드시 번들을 강제 재생성한다:
        //       rm -rf android/app/build/generated/assets/react && ./gradlew bundleRelease assembleRelease
        //     그리고 릴리즈 APK를 실기기에 깔아 배너에 "테스트 광고" 배지가 없는지 눈으로 확인한다
        //     (2026-08-13 확인: 배지 사라지고 AdChoices ⓘ 붙은 실광고 표시. 클릭은 절대 금지).
        // 🔴 2026-08-13 — **그날이 왔다.** 비공개 테스트 종료 → 프로덕션 트랙 출시본으로 12 → 13.
        //   이 빌드부터 광고는 **실광고**다(.env의 EXPO_PUBLIC_ANDROID_REAL_ADS=true).
        //   위 경고는 방향만 뒤집혀 그대로 유효하다 — **이 빌드를 비공개 테스트 트랙에 올리면 안 된다.**
        //   담긴 것 중 오늘 실기기 검증 완료:
        //     · 유튜브 영상이 20초에 강제로 넘어가던 회귀(틱톡용 폴백이 유튜브에도 걸렸다)
        //       검증: near-end 4연속 32/33s·49/50s·47/48s·37/38s, no-progressbar 발사 0회
        //     · 앱 전환 시 세션 분리, 앱별 사용시간 집계(분석 탭 "YouTube 15m·88% / TikTok 2m·12%")
        //     · 접근성 OFF→ON 배너 양방향, 서버 날짜 클램프(±1일)
        versionCode 18
        // ⚠️ bare workflow에서 **진짜 값은 이 파일**이다(위 versionCode 주석 참고). app.json의
        //   expo.version과 반드시 같이 올릴 것 — 2026-08-13에 versionCode만 12로 올리고 이 문자열을
        //   1.0.2로 남겨둬서, 스토어에 1.0.2로 올라갈 뻔했다(QA_FULL_TEST 발견 13).
        versionName "1.0.9"

        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", "\"${findProperty('reactNativeReleaseLevel') ?: 'stable'}\""
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // 🔴 2026-08-10 사장님 지시("로컬로 비용 안 들게") — 스토어 업로드용 AAB를 EAS 빌드 없이
        //   로컬에서 만들기 위한 서명 설정.
        //   그전엔 release가 **디버그 키로 서명**됐다(아래 buildTypes 주석 참고). 기기 설치는 되지만
        //   Play Console은 업로드 키 서명만 받으므로 스토어에 올릴 수가 없었다.
        //   → EAS가 보관하던 업로드 키를 `eas credentials`로 내려받아(빌드가 아니라 무료) 쓴다.
        //     SHA1이 EAS 콘솔 표시값(B8:FC:9F:58:...:F4:C7)과 일치하는 것을 확인했다.
        //   ⚠️ 키와 비밀번호는 **절대 커밋하지 않는다** — credentials.json / credentials/ 는
        //     .gitignore에 넣어뒀고, 여기서는 값을 직접 쓰지 않고 파일에서 읽기만 한다.
        //   ⚠️ 키가 없는 환경(CI, 다른 PC, 클론 직후)에서도 빌드가 깨지지 않아야 하므로 파일이 없으면
        //     이 설정을 만들지 않고 아래에서 디버그 서명으로 자동 폴백한다.
        //   값은 android/keystore.properties에서 읽는다(JSON 파서 의존 없이 java.util.Properties만 사용).
        //   그 파일은 credentials.json에서 한 번 만들어 두며 .gitignore에 들어간다.
        if (rootProject.file('keystore.properties').exists()) {
            def props = new Properties()
            rootProject.file('keystore.properties').withInputStream { props.load(it) }
            release {
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }
    // 🔴 2026-08-25 — 스토어 빌드에 **테스트 플래그가 실려 나가는 것**을 빌드가 직접 막는다.
    //   EXPO_PUBLIC_AD_TEST_DEVICES는 포커스온 광고 게이트를 통째로 건너뛰는 플래그다(매출 직결).
    //   .env 주석에 "스토어 빌드 전 반드시 다시 주석"이라고 적혀 있지만, 그건 사람 기억에
    //   의존하는 안전장치다 — 한 번 잊으면 무료로 무제한 연장이 나가고 되돌릴 수 없다.
    //
    //   🔴 2026-08-27 — **이 가드가 뚫려 있었다.** System.getenv만 봤는데, 실제 값은 `.env`에서
    //     @expo/env가 읽어 JS 번들에 박아 넣는다. 즉 `.env`를 켜고 빌드하면 가드는 통과하고
    //     플래그는 그대로 실린다 — 어제 내가 그 구멍으로 그냥 빌드했다(실측: testMode=true).
    //     가드가 막아야 할 바로 그 경로를 못 막고 있었다.
    //   → 환경변수와 `.env` **둘 다** 본다. `.env`는 주석(#)과 값 뒤 인라인 주석을 걸러서 판정한다
    //     (인라인 주석이 값에 섞여 `=== 'true'`가 항상 거짓이 되던 것도 2026-08-27에 실측으로 확인).
    gradle.taskGraph.whenReady { graph ->
        def releasing = graph.allTasks.any { it.name.toLowerCase().contains("release") }
        if (!releasing) return

        def flagOn = { String v -> v != null && v.trim().replaceAll(/\s+#.*$/, "").trim() == "true" }
        def envOn = flagOn(System.getenv("EXPO_PUBLIC_AD_TEST_DEVICES"))

        def dotEnvOn = false
        def dotEnv = new File(rootProject.projectDir.parentFile, ".env")
        if (dotEnv.exists()) {
            dotEnv.eachLine { line ->
                def t = line.trim()
                if (t.startsWith("#")) return                     // 주석 처리된 줄은 꺼진 것
                def m = t =~ /^EXPO_PUBLIC_AD_TEST_DEVICES\s*=\s*(.*)$/
                if (m.find() && flagOn(m.group(1))) dotEnvOn = true
            }
        }

        // 🔴 2026-08-27 — 가드가 **로컬 테스트까지 막아버리면** 사장님이 손짓을 검증할 수 없다
        //   (포커스온 광고 게이트에 걸려 세션 자체를 못 연다). 가드의 목적은 "실수로 스토어에
        //   실리는 것"을 막는 것이지 로컬 검증을 막는 것이 아니다.
        //   → 스토어 산출물인 **AAB(bundleRelease)는 예외 없이 차단**하고, 로컬 테스트 APK
        //     (assembleRelease)만 `-PallowAdTestFlag=true`를 **명시적으로 붙였을 때** 허용한다.
        //     실수로 붙을 수 있는 옵션이 아니고, 스토어 업로드는 AAB라 그 경로는 그대로 막힌다.
        // ⚠️ "bundle"을 부분일치로 보면 안 된다 — assembleRelease도 createBundleReleaseJsAndAssets
        //   같은 태스크를 함께 돌려서 로컬 APK까지 스토어 산출물로 오인한다(2026-08-27 실측).
        //   스토어 AAB를 만드는 태스크는 이름이 정확히 bundleRelease다.
        def bundling = graph.allTasks.any { it.name == "bundleRelease" }
        def explicitOptIn = project.hasProperty("allowAdTestFlag") && project.property("allowAdTestFlag") == "true"
        if ((envOn || dotEnvOn) && !bundling && explicitOptIn) {
            logger.lifecycle("⚠️  EXPO_PUBLIC_AD_TEST_DEVICES=true 로 **로컬 테스트 APK**를 만듭니다 " +
                "(-PallowAdTestFlag=true). 이 APK는 광고 게이트를 건너뜁니다 — 스토어에 올리지 마세요.")
            return
        }
        if (envOn || dotEnvOn) {
            throw new GradleException(
                "릴리즈 빌드에 EXPO_PUBLIC_AD_TEST_DEVICES=true가 켜져 있습니다" +
                (dotEnvOn ? " (.env)" : "") + (envOn ? " (환경변수)" : "") + ". " +
                "이 플래그는 광고 게이트를 건너뛰므로 스토어 빌드에 실리면 안 됩니다. " +
                ".env에서 주석 처리하고(맨 앞에 #) 다시 빌드하세요.")
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // 🔴 2026-08-10 — 원래 여기가 `signingConfigs.debug`였다(Expo prebuild 기본값).
            //   그래서 로컬 릴리즈 빌드는 **디버그 키 서명**이었고, 기기 설치는 되지만 Play Console은
            //   거부한다(업로드 키 서명만 받는다). 스토어행은 늘 EAS 빌드에 의존할 수밖에 없었다.
            //   → 업로드 키가 있으면 그걸 쓰고, 없으면(다른 PC/CI/클론 직후) 예전처럼 디버그로 폴백한다.
            //     폴백을 남기는 이유: 키 없는 환경에서 빌드가 통째로 깨지면 개발이 막힌다.
            //     ⚠️ 폴백으로 만든 AAB는 스토어에 못 올린다 — 아래 로그로 어느 쪽인지 항상 드러나게 했다.
            //   ⚠️ buildType 블록 안에서는 doFirst 같은 Task DSL을 쓸 수 없다(평가 시점이 다르다) —
            //     어느 키로 서명됐는지는 빌드 후 AAB를 직접 까서 확인한다(그게 더 확실한 증거이기도 하다).
            signingConfig signingConfigs.findByName('release') ?: signingConfigs.debug
            def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'false'
            shrinkResources enableShrinkResources.toBoolean()
            minifyEnabled enableMinifyInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'
            crunchPngs enablePngCrunchInRelease.toBoolean()
        }
    }
    packagingOptions {
        jniLibs {
            def enableLegacyPackaging = findProperty('expo.useLegacyPackaging') ?: 'false'
            useLegacyPackaging enableLegacyPackaging.toBoolean()
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${expoLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${expoLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${expoLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
