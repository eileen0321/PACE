apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.paceoverlay'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

android {
  namespace "expo.modules.paceoverlay"
  defaultConfig {
    minSdkVersion getDefaultConfigProperty("minSdkVersion")
    targetSdkVersion getDefaultConfigProperty("targetSdkVersion")
  }
}
