spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pace?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:pace}
    password: ${DB_PASSWORD:pace}
  jpa:
    show-sql: true

logging:
  level:
    com.pace.backend: DEBUG
    org.hibernate.SQL: DEBUG
