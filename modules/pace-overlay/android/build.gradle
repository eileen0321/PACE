plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.paceoverlay'
version = '0.1.0'

android {
  namespace "expo.modules.paceoverlay"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

// 2026-07-24 손 밀어내기(shoo) 제스처 — CameraX(카메라 프레임만, 미리보기 UI 없음) + MediaPipe
// HandLandmarker(온디바이스 손 랜드마크 추적, 클라우드 전송 없음). 모델 파일은 이 모듈의
// src/main/assets/hand_landmarker.task로 같이 커밋해뒀다(android/ 최상위 폴더는 .gitignore돼 있어
// 거기 두면 유실되므로 반드시 이 모듈 안에 둬야 함).
dependencies {
  implementation "androidx.camera:camera-core:1.4.2"
  implementation "androidx.camera:camera-camera2:1.4.2"
  implementation "androidx.camera:camera-lifecycle:1.4.2"
  implementation "com.google.mediapipe:tasks-vision:0.10.29"
  // 2026-08-02 사장님 지시("쇼츠 오버레이 상태에서 FOCUS OFF 누르면 앱으로 가지 말고 광고 창을
  // 바로 띄워라") — 보상형 광고를 오버레이에서 직접 띄우려면 이 모듈이 GMA SDK를 알아야 한다.
  // 이미 react-native-google-mobile-ads가 앱에 포함시키는 것과 같은 아티팩트라 새 의존성이 아니다.
  implementation "com.google.android.gms:play-services-ads:24.9.0"
  // 2026-08-22 사장님 지적("틱톡처럼 바텀시트로 띄우던가") — 기존 @react-native-google-signin의
  // 무료(Original) 경로는 play-services-auth의 **레거시 전체화면 다이얼로그**
  // (com.google.android.gms/.common.account.AccountPickerActivity)를 띄운다. 라이트 모드 기기에서
  // 그 다이얼로그는 흰 카드 + 회색 하단 띠로 나와, 다크 고정인 우리 앱에서 유독 깨져 보였다.
  // 틱톡 등이 쓰는 바텀시트는 Credential Manager(androidx.credentials) 경로인데, 그 API는
  // 라이브러리의 **유료 Universal Sign In 모듈**에만 있고 우리가 설치한 무료 패키지는
  // GoogleSignin(레거시) 하나만 export한다(node_modules에서 확인). 그래서 같은 일을 이 모듈에서
  // 직접 한다 — 유료 모듈이 감싸는 것과 동일한 공식 API다.
  implementation "androidx.credentials:credentials:1.6.0"
  implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
  implementation "com.google.android.libraries.identity.googleid:googleid:1.2.0"
}
