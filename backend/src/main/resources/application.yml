spring:
  application:
    name: pace-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      # jlpt-master는 ddl-auto=update(임시방편)였지만 Pace는 Flyway가 스키마를 관리하므로
      # validate로 고정 — 애플리케이션이 기대하는 엔티티와 실제 DB 스키마가 어긋나면 기동 시점에 즉시 실패.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

pace:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:2592000000} # 30일
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  apple:
    bundle-id: ${APPLE_BUNDLE_ID:com.strides7.pace}
  revenuecat:
    webhook-auth-header: ${REVENUECAT_WEBHOOK_AUTH_HEADER:}
    api-key: ${REVENUECAT_API_KEY:}
  # 오버레이 P 메뉴 "Shorts HOT" 갱신 전용 — 클라이언트 EXPO_PUBLIC_YOUTUBE_API_KEY와는 별개 키다.
  # 서버 환경변수에만 존재해야 하며 절대 앱 번들에 노출하지 않는다(src/services/api/youtube.ts
  # 상단 주석의 2026-07-19 보안 교훈과 동일 원칙).
  youtube:
    api-key: ${YOUTUBE_API_KEY:}
  cors:
    allowed-origins: ${CORS_ORIGINS:*}

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs
